name: Auto Update IMD Forecast

on:
  schedule:
    # 9:00 PM IST is 15:30 UTC
    - cron: '30 15 * * *'
    # 7:00 AM IST is 01:30 UTC
    - cron: '30 1 * * *'
  workflow_dispatch: # Allows you to manually click a "Run workflow" button in the GitHub Actions tab

permissions:
  contents: write # Required for the auto-commit action to be able to push to the repo

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pdfplumber

      - name: Fetch and Parse IMD Data
        run: |
          # Run script and save JSON directly to the frontend's public folder
          python parse_imd.py > web-app/public/forecast.json

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update forecast.json"
          file_pattern: "web-app/public/forecast.json"
